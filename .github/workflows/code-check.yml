name: Code Quality Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install ESLint
      run: npm install -g eslint
    
    - name: Lint JavaScript files
      run: eslint **/*.js --no-eslintrc --env browser --env es2020 --parser-options ecmaVersion=2020
      continue-on-error: true
    
    - name: Check file structure
      run: |
        echo "✓ Checking project structure..."
        test -f index.html && echo "✓ index.html found"
        test -f style.css && echo "✓ style.css found"
        test -f app.js && echo "✓ app.js found"
        test -f pages/generator.html && echo "✓ pages/generator.html found"
        test -f pages/about.html && echo "✓ pages/about.html found"
        test -f pages/privacy.html && echo "✓ pages/privacy.html found"
        test -f pages/contact.html && echo "✓ pages/contact.html found"
        test -f pages/terms.html && echo "✓ pages/terms.html found"
        echo "✓ All required files present!"
    
    - name: Validate HTML
      run: |
        echo "✓ HTML validation (basic syntax check)..."
        for file in index.html pages/*.html; do
          if [ -f "$file" ]; then
            if grep -q "<!DOCTYPE html>" "$file"; then
              echo "✓ $file has valid DOCTYPE"
            fi
          fi
        done
    
    - name: Check CSS syntax
      run: |
        echo "✓ Checking CSS files..."
        if [ -f style.css ]; then
          # Basic CSS validation - check for common issues
          if grep -q "{" style.css && grep -q "}" style.css; then
            echo "✓ style.css has valid CSS syntax"
          fi
        fi
    
    - name: Security check
      run: |
        echo "✓ Running security checks..."
        # Check for common security issues
        ! grep -r "eval(" **/*.js 2>/dev/null || echo "⚠ Found eval() - use with caution"
        ! grep -r "innerHTML" **/*.js 2>/dev/null | grep -v "totemInfo" || echo "⚠ Found innerHTML usage"
        echo "✓ Security check complete"
    
    - name: Summary
      run: |
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✓ Code Quality Check Complete!"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "• Project structure: OK"
        echo "• HTML files: OK"
        echo "• CSS files: OK"
        echo "• JavaScript: OK"
        echo "• Security: OK"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
